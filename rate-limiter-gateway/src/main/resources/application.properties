spring.application.name=rate-limiter-gateway
server.port=8000

# Gateway Discovery Locator
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# External Eureka Server URL
eureka.client.service-url.defaultZone=http://localhost:9000/eureka/

rate-limiter.url=http://rate-limiter-service/ratelimit/check
url-shortener.url=http://rate-limiter-url-shortener-service/urlShortener
registration.url=http://rate-limiter-registration-service/register